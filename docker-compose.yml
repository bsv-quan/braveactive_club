name: braveactive-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: braveactive
      POSTGRES_USER: braveactive
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braveactive -d braveactive"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://braveactive:local-only-password@db:5432/braveactive
      FRONTEND_ORIGINS: http://localhost:3003,http://127.0.0.1:3003
      FRONTEND_BASE_URL: http://localhost:3003
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:8008:8000"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8008/ws/feed
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      backend:
        condition: service_healthy

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: braveactive_test
      POSTGRES_USER: braveactive_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braveactive_test -d braveactive_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-tests:
    profiles: ["test"]
    build: ./backend
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://braveactive_test:test-only-password@test-db:5432/braveactive_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["pytest", "-q"]

volumes:
  db-data:
  uploads:
  logs:
